<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Staggered entrance animations for the list items */
        .fade-in-up {
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInUp 0.6s ease-out forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.3s; }
        .delay-3 { animation-delay: 0.5s; }
        .delay-4 { animation-delay: 0.7s; }

        /* Custom glow for the active state to reinforce the theme */
        .glow-active {
            box-shadow: 0 0 15px rgba(158, 207, 218, 0.2);
        }
    </style>

<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop antialiased font-body-md overflow-hidden relative">
<!-- Ambient background glow (subtle glassmorphism/depth effect) -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary/5 rounded-full blur-[100px]"></div>
</div>
<!-- Main Analyzing Card Container -->
<main class="relative z-10 w-full max-w-[480px] bg-surface-container-low border border-surface-variant rounded-xl p-lg shadow-2xl flex flex-col items-center">
<!-- Shader Animation Container -->
<div class="w-[120px] h-[120px] mb-lg relative flex items-center justify-center rounded-full bg-surface-container border border-outline-variant/30 glow-active">
<!-- Pulsing ring behind the shield -->
<div class="absolute inset-0 rounded-full border-2 border-primary/20 animate-ping" style="animation-duration: 3s;"></div>
<div class="w-16 h-16 relative">

</div>
</div>
<!-- Typography -->
<div class="text-center mb-xl">
<h1 class="font-h2-desktop text-h2-desktop text-primary mb-sm">Analyzing Profile</h1>
<p class="font-body-md text-body-md text-on-surface-variant">This usually takes about 15 seconds.</p>
</div>
<!-- Analysis Modules Checklist -->
<div class="w-full flex flex-col gap-sm">
<!-- Module 1: Completed -->
<div class="flex items-center gap-md p-sm rounded-lg bg-surface transition-colors fade-in-up delay-1">
<div class="w-8 h-8 flex items-center justify-center rounded-full bg-primary/10 text-primary">
<span class="material-symbols-outlined text-[20px]" data-icon="check_circle" data-weight="fill">check_circle</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">Language Analysis</span>
</div>
<!-- Module 2: Active -->
<div class="flex items-center gap-md p-sm rounded-lg bg-surface-container-high border border-primary/20 transition-colors fade-in-up delay-2">
<div class="w-8 h-8 flex items-center justify-center rounded-full text-primary">
<span class="material-symbols-outlined text-[20px] animate-spin" data-icon="progress_activity">progress_activity</span>
</div>
<span class="font-body-lg text-body-lg text-primary-fixed">Document Check</span>
</div>
<!-- Module 3: Pending -->
<div class="flex items-center gap-md p-sm rounded-lg transition-colors fade-in-up delay-3 opacity-60">
<div class="w-8 h-8 flex items-center justify-center">
<div class="w-3 h-3 rounded-full bg-outline-variant"></div>
</div>
<span class="font-body-lg text-body-lg text-on-surface-variant">Company Verification</span>
</div>
<!-- Module 4: Pending -->
<div class="flex items-center gap-md p-sm rounded-lg transition-colors fade-in-up delay-4 opacity-60">
<div class="w-8 h-8 flex items-center justify-center">
<div class="w-3 h-3 rounded-full bg-outline-variant"></div>
</div>
<span class="font-body-lg text-body-lg text-on-surface-variant">Link Safety</span>
</div>
</div>
</main>
